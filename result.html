<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forecast Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Forecast Results</h2>

        <div id="plot-container" style="height: 500px;"></div>

        <div class="mt-3 text-center">
            <a href="{{ url_for('download_file', filename=forecast_file) }}" class="btn btn-success">⬇ Download Forecast CSV</a>
        </div>
    </div>

    <script>
        const plotData = JSON.parse(`{{ plot_data | safe }}`);
        Plotly.newPlot('plot-container', plotData.data, plotData.layout);
    </script>
</body>
</html>
