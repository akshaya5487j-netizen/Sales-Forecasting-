<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Forecasting Tool</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Sales Forecasting Tool</h1>

        <div class="card">
            <div class="card-header">
                <h5>Upload Historical Sales Data</h5>
            </div>
            <div class="card-body">
                <form id="upload-form">
                    <div class="mb-3">
                        <label for="file" class="form-label">Select CSV File</label>
                        <input type="file" class="form-control" id="file" accept=".csv" required>
                    </div>
                    <div class="mb-3">
                        <label for="model" class="form-label">Select Forecasting Model</label>
                        <select class="form-control" id="model" required>
                            <option value="prophet">Prophet</option>
                            <option value="arima">ARIMA</option>
                            <option value="xgboost">XGBoost</option>
                            <option value="linear">Linear Regression</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
                <div class="alert alert-danger" id="error-alert" role="alert"></div>
            </div>
        </div>

        <div class="card" id="preview-card" style="display: none;">
            <div class="card-header">
                <h5>Data Preview</h5>
            </div>
            <div class="card-body">
                <div id="preview-content"></div>
                <div class="mb-3">
                    <label for="years" class="form-label">Years to Forecast</label>
                    <input type="number" class="form-control" id="years" value="1" min="1" max="5">
                </div>
                <button class="btn btn-primary" id="predict-btn">Generate Forecast</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Processing...</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
